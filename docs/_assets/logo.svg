<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="wrf_gpu logo: a smiling storm cloud whose lightning bolt is a GPU circuit trace, held up by a Claude-clay and a GPT-green robot">
  <title>wrf_gpu</title>
  <defs>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf0fb"/>
      <stop offset="1" stop-color="#b9c9ec"/>
    </linearGradient>
  </defs>

  <!-- GPU die under the weather: the cloud is "computed" on a chip -->
  <g stroke="#334970" stroke-width="2.4" fill="none" stroke-linecap="round">
    <line x1="30" y1="112" x2="30" y2="120"/>
    <line x1="46" y1="112" x2="46" y2="120"/>
    <line x1="82" y1="112" x2="82" y2="120"/>
    <line x1="98" y1="112" x2="98" y2="120"/>
    <line x1="18" y1="96"  x2="10" y2="96"/>
    <line x1="18" y1="104" x2="10" y2="104"/>
    <line x1="110" y1="96" x2="118" y2="96"/>
    <line x1="110" y1="104" x2="118" y2="104"/>
  </g>
  <rect x="18" y="86" width="92" height="28" rx="5" fill="#20304f"/>
  <rect x="24" y="92" width="80" height="16" rx="3" fill="#2c4066"/>
  <text x="64" y="104" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#7fd4c1" text-anchor="middle" letter-spacing="1">GPU</text>

  <!-- Storm cloud -->
  <path d="M40 66 a20 20 0 0 1 5-39 24 24 0 0 1 45 6 17 17 0 0 1 3 33 z"
        fill="url(#cloud)" stroke="#334970" stroke-width="3"/>
  <!-- Happy face -->
  <circle cx="52" cy="46" r="3.4" fill="#334970"/>
  <circle cx="72" cy="46" r="3.4" fill="#334970"/>
  <path d="M50 55 q12 9 24 0" fill="none" stroke="#334970" stroke-width="3" stroke-linecap="round"/>

  <!-- Lightning bolt drawn as a circuit trace: nodes at the vertices -->
  <path d="M66 62 L54 82 L64 82 L52 104" fill="none" stroke="#f4b41a" stroke-width="4.5"
        stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="66" cy="62" r="3.2" fill="#f4b41a" stroke="#334970" stroke-width="1.4"/>
  <circle cx="54" cy="82" r="3.2" fill="#f4b41a" stroke="#334970" stroke-width="1.4"/>
  <circle cx="52" cy="104" r="3.2" fill="#f4b41a" stroke="#334970" stroke-width="1.4"/>

  <!-- Two AI helpers propping up the weather: Claude-clay + GPT-green -->
  <!-- Claude (left) -->
  <g>
    <line x1="16" y1="60" x2="16" y2="52" stroke="#c8613f" stroke-width="2"/>
    <circle cx="16" cy="50" r="2.4" fill="#c8613f"/>
    <rect x="6" y="60" width="20" height="18" rx="5" fill="#d97757" stroke="#334970" stroke-width="2.4"/>
    <circle cx="12" cy="69" r="2.1" fill="#fff"/>
    <circle cx="20" cy="69" r="2.1" fill="#fff"/>
  </g>
  <!-- GPT (right) -->
  <g>
    <line x1="112" y1="60" x2="112" y2="52" stroke="#0d8f6f" stroke-width="2"/>
    <circle cx="112" cy="50" r="2.4" fill="#0d8f6f"/>
    <rect x="102" y="60" width="20" height="18" rx="5" fill="#10a37f" stroke="#334970" stroke-width="2.4"/>
    <circle cx="108" cy="69" r="2.1" fill="#fff"/>
    <circle cx="116" cy="69" r="2.1" fill="#fff"/>
  </g>
</svg>
